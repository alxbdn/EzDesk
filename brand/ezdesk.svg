<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- EzDesk app icon, V27 "Dock": Desky over a little dock of desktops, its screen and dock ringed with the glow, on a deep Aurora tile -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F9A72"/>
      <stop offset="1" stop-color="#1A3BB8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BC82F3"/><stop offset="0.2" stop-color="#F5B9EA"/><stop offset="0.4" stop-color="#8D9FFF"/>
      <stop offset="0.6" stop-color="#FF6778"/><stop offset="0.8" stop-color="#FFBA71"/><stop offset="1" stop-color="#C686FF"/>
    </linearGradient>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#aurora)"/>
  <rect x="18" y="16" width="64" height="46" rx="12" fill="none" stroke="url(#glow)" stroke-width="5" filter="url(#haze)"/>
  <rect x="18" y="16" width="64" height="46" rx="12" fill="#121318"/>
  <rect x="18" y="16" width="64" height="46" rx="12" fill="none" stroke="url(#glow)" stroke-width="1.6"/>
  <g fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32.5 38 H45.5 A6.5 6.5 0 1 0 43.6 42.6" stroke="#FFFFFF"/>
    <path d="M54 31.5 H66 L54 44.5 H66" stroke="#00B85E"/>
    <path d="M44 53 Q50 57 56 53" stroke="#FFFFFF"/>
  </g>
  <rect x="20" y="70" width="60" height="16" rx="7" fill="none" stroke="url(#glow)" stroke-width="4" filter="url(#haze)"/>
  <rect x="20" y="70" width="60" height="16" rx="7" fill="#121318"/>
  <rect x="20" y="70" width="60" height="16" rx="7" fill="none" stroke="url(#glow)" stroke-width="1.4"/>
  <rect x="25" y="74" width="14" height="8" rx="2" fill="#FFFFFF" opacity=".9"/>
