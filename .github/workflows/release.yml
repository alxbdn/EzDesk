name: Build release zip

# Pull requests: build and check the zip (downloadable as an artifact).
# Tags v*: same, then publish it as a GitHub Release.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        shell: powershell
        run: cargo test --release --locked

      - name: Build zip
        shell: powershell
        env:
          EZDESK_REQUIRE_RESOURCES: '1'     # the exe must get its icon and version info
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -ne $cargo) { throw "Tag v$v doesn't match the version in Cargo.toml ($cargo)" }
          } else { $v = "$cargo-dev.$($env:GITHUB_SHA.Substring(0, 7))" }
          .\build-release.ps1 -Version $v

      - name: Check zip
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("dist\EzDesk.zip"); $names = $z.Entries.FullName; $z.Dispose()
          $required = 'EzDesk.exe', 'VirtualDesktopAccessor.dll', 'VirtualDesktopAccessor-win10.dll', 'icons/1.ico', 'icons/more.ico',
                      'README.txt', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt', 'admin/install.ps1', 'admin/Install admin mode.cmd'
          foreach ($n in $required) { if ($names -notcontains "EzDesk/$n") { throw "zip is missing $n" } }
          if ($names -like '*\*') { throw 'zip entries must use / separators' }
          $vi = (Get-Item dist\EzDesk\EzDesk.exe).VersionInfo
          if ($vi.FileDescription -ne 'EzDesk' -or $vi.ProductName -ne 'EzDesk') { throw "exe has no version info: '$($vi.FileDescription)' / '$($vi.ProductName)'" }
          Get-Content dist\EzDesk.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: EzDesk
          path: dist/EzDesk.zip

      # Microsoft Store package. Unsigned on purpose: the Store signs it on submission,
      # so it's an artifact to upload to Partner Center, not a release download.
      - name: Build Store package (MSIX)
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.1' }
          .\store\build-msix.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: EzDesk-store-msix
          path: dist/EzDesk.msix

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same zip under the old name, so links to .../releases/latest/download/DesktopSwitcher.zip keep working
          Copy-Item dist\EzDesk.zip dist\DesktopSwitcher.zip
          gh release create $env:GITHUB_REF_NAME dist\EzDesk.zip dist\EzDesk.zip.sha256 dist\DesktopSwitcher.zip `
            --title "EzDesk $env:GITHUB_REF_NAME" --notes-file .github\release-notes.md
